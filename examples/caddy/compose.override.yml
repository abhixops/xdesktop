# xdesktop behind Caddy: automatic HTTPS (Let's Encrypt) + basic auth.
# Usage (from the repo root):
#   docker compose -f docker-compose.yml -f examples/caddy/compose.override.yml up -d
# Required in .env: XDESKTOP_DOMAIN, CADDY_EMAIL, BASIC_AUTH_USER, BASIC_AUTH_HASH
# See examples/caddy/README.md.

services:
  xdesktop:
    environment:
      # Caddy terminates TLS; noVNC also answers plain HTTP on the internal network.
      NOVNC_SSL_ONLY: "false"
    # Not published on the host at all; only reachable through Caddy.
    ports: !reset []

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - xdesktop
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      XDESKTOP_DOMAIN: ${XDESKTOP_DOMAIN:?set XDESKTOP_DOMAIN in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env (caddy hash-password)}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
    volumes:
      - ./examples/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
