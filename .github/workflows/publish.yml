name: Release Tag and Publish Docker Image

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to build and publish (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  auto-tag:
    name: Determine and Create Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    outputs:
      new_tag: ${{ steps.calculate_tag.outputs.new_tag }}
      should_publish: ${{ steps.calculate_tag.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse PR prefix and calculate SemVer
        id: calculate_tag
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          BUMP=""
          # 1.1.1 principle:
          # First number (Major) -> release:
          # Second number (Minor) -> feat:
          # Third number (Patch) -> fix:
          if echo "$PR_TITLE" | grep -Ei '^(release)(\(.*\))?:' >/dev/null; then
            BUMP="major"
          elif echo "$PR_TITLE" | grep -Ei '^(feat)(\(.*\))?:' >/dev/null; then
            BUMP="minor"
          elif echo "$PR_TITLE" | grep -Ei '^(fix)(\(.*\))?:' >/dev/null; then
            BUMP="patch"
          fi

          if [ -z "$BUMP" ]; then
            echo "No matching prefix (release:, feat:, fix:) found in PR title. Skipping tag creation."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Determined bump type: $BUMP"

          # Fetch all tags from origin
          git fetch --tags --force

          # Find latest semantic version tag
          LATEST_TAG=$(git tag -l "v*.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing semantic tags found. Starting from 0.0.0 baseline."
            MAJOR=0
            MINOR=0
            PATCH=0
          else
            echo "Found existing latest tag: $LATEST_TAG"
            CLEAN_TAG="${LATEST_TAG#v}"
            MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
            PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)
          fi

          case "$BUMP" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "Calculated new tag: $NEW_TAG"

          # Configure git and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Automated release $NEW_TAG from merged PR [skip ci]"
          git push origin "$NEW_TAG"

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Build & Push Multi-Arch Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: [auto-tag]
    if: |
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'pull_request' && needs.auto-tag.outputs.should_publish == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target image tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="${{ needs.auto-tag.outputs.new_tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="latest"
          fi
          echo "Resolved Tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-architecture emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.resolve_tag.outputs.tag }}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
